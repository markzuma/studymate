name: Build PERIAK Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout PERIAK
        uses: actions/checkout@v5

      - name: Configure Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Configure Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli@1.27.0

      - name: Configure Android tools
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK"

          echo "Android SDK: $SDK"

          MANAGER=$(find "$SDK/cmdline-tools" -type f -name sdkmanager | head -1)
          test -x "$MANAGER"

          if [ ! -e "$SDK/bin" ]; then
            ln -s "$(dirname "$MANAGER")" "$SDK/bin"
          fi

          if [ ! -e "$SDK/lib" ]; then
            ln -s "$(dirname "$(dirname "$MANAGER")")/lib" "$SDK/lib"
          fi

          mkdir -p "$HOME/.bubblewrap"

          export PERIAK_SDK="$SDK"

          node -e 'require("fs").writeFileSync(process.env.HOME+"/.bubblewrap/config.json", JSON.stringify({jdkPath:process.env.JAVA_HOME,androidSdkPath:process.env.PERIAK_SDK}))'

          bubblewrap doctor

      - name: Generate Android project
        working-directory: android-app
        run: bubblewrap update --skipVersionUpgrade

      - name: Restore signing key
        working-directory: android-app
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > periak-release.jks
          chmod 600 periak-release.jks

      - name: Build signed APK and AAB
        working-directory: android-app
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bubblewrap build --skipPwaValidation

      - name: Prepare release files
        working-directory: android-app
        run: |
          mkdir -p release
          cp app-release-signed.apk release/PERIAK-1.0.0.apk
          cp app-release-bundle.aab release/PERIAK-1.0.0.aab
          ls -lh release/

      - name: Upload Android packages
        uses: actions/upload-artifact@v4
        with:
          name: PERIAK-Android-1.0.0
          path: android-app/release/
          retention-days: 30
          if-no-files-found: error

      - name: Remove temporary signing key
        if: always()
        run: rm -f android-app/periak-release.jks
